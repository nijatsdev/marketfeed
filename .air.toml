root = "."
tmp_dir = "tmp"

[build]
  bin = "./bin/marketfeed"
  cmd = "make build"
  delay = 1000
  exclude_dir = ["tmp"]
  exclude_regex = ["_test.go"]
  exclude_unchanged = false
  include_ext = ["go", "yaml"]
  kill_delay = "0s"
  log = "build-errors.log"
  send_interrupt = false
  stop_on_error = false

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  time = false

[misc]
  clean_on_exit = false

[screen]
  clear_on_rebuild = false
  keep_scroll = true