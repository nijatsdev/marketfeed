# The marketfeed symbol catalog — the single source of the instruments the
# feed simulates. Add, edit, or remove entries here; the file is embedded at
# build time, so rebuild and restart to apply (`make watch` does both on save).
#
# Only tick_size and base_price are required. Every other field is optional and
# defaults sensibly, so entries stay short — set a field only when a symbol
# genuinely differs from the default:
#   description, exchange     display only (default: empty)
#   multiplier                contract multiplier (default 1)
#   tick_value                default tick_size × multiplier
#   initial_margin            display only (default 0)
#   volatility                fractional move per tick (default 0.001)
#   spread_ticks              calm-market half-spread (default 1)
#   tick_interval_ms          per-symbol tick cadence (default: global TICK_INTERVAL_MS)

